# Publishes the tiles of the last "Build map" run again, without building them again (a few minutes, not 2 hours).
# Use it when a build made all its tiles but the publish step stopped (Nov 27, build #13).
# Actions > Publish only > Run workflow. Leave "run" empty for the last Build map run.
name: Publish only

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Build map run id (empty = the last one)'
        default: ''

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: build-map
  cancel-in-progress: false

jobs:
  # (Nov 27) packing and sending are two jobs, as GitHub's own Pages example does: in one job the website step
  # sometimes can't see the files just packed yet. The name carries the attempt, so "Re-run" never finds two.
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: run
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          R="${{ inputs.run }}"
          if [ -z "$R" ]; then R=$(gh run list -R "${{ github.repository }}" --workflow build-map.yml --limit 1 --json databaseId -q '.[0].databaseId'); fi
          echo "using Build map run $R"
          echo "id=$R" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { name: plan, path: plan, run-id: '${{ steps.run.outputs.id }}', github-token: '${{ github.token }}' }
      # (Nov 27, Publish only #2: the download step above only saw the first 100 of the run's 154 artifacts, so 34 parts
      # of the map were left out, south Nuns' Island among them) gh lists them all; each part is checked in below
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh run download "${{ steps.run.outputs.id }}" -R "${{ github.repository }}" -p 'tiles-*' -D parts_dl
          n=$(ls parts_dl | wc -l); echo "map parts downloaded: $n"
          mkdir -p site && for d in parts_dl/*/; do cp -r "$d". site/; done
          E=$(python -c "import json;print(len(json.load(open('plan/plan.json'))['chunks']))"); echo "map parts expected: $E"
          [ "$n" -ge "$E" ] || { echo "missing map parts: not publishing (the live map stays as it was)"; exit 1; }
      - run: |
          python builder/merge.py site plan/plan.json plan/idx.json
          rm -rf site/parts site/checks
          cp site-files/* site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: site, name: 'pages-${{ github.run_attempt }}' }
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with: { artifact_name: 'pages-${{ github.run_attempt }}' }
