name: probe
on:
  push:
    branches: [probe]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q osmium-tool jq >/dev/null
          curl -sL https://download.geofabrik.de/north-america/canada/quebec-latest.osm.pbf -o q.pbf; ls -la q.pbf
          osmium extract -b -73.5430,45.4690,-73.5330,45.4760 -s complete_ways q.pbf -o a.pbf
          osmium tags-filter a.pbf w/building w/building:part r/building -o b.pbf
          osmium export b.pbf -f geojsonseq -o b.geojsonseq --add-unique-id=type_id
          echo "features $(wc -l < b.geojsonseq)"
          tr -d '\036' < b.geojsonseq | jq -c 'select(.properties.height or .properties["building:levels"]) | {id:.id,b:(.properties.building//"part"),h:.properties.height,lv:.properties["building:levels"],minlv:.properties["building:min_level"],name:.properties.name}' | head -80
