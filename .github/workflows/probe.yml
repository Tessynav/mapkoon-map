name: probe
on:
  push:
    branches: [probe]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA='MapKoon-builder/1.0 (github.com/Tessynav/mapkoon-map)'
          Q='[out:json][timeout:60];(way(45.4690,-73.5430,45.4760,-73.5330)["building"];way(45.4690,-73.5430,45.4760,-73.5330)["building:part"];relation(45.4690,-73.5430,45.4760,-73.5330)["building"];);out tags center;'
          for S in https://overpass.kumi.systems/api/interpreter https://overpass-api.de/api/interpreter; do curl -s -A "$UA" --data-urlencode "data=$Q" $S -o a.json; jq -e .elements a.json >/dev/null 2>&1 && break; done
          echo "elements $(jq '.elements|length' a.json)"
          jq -c '.elements[] | select(.tags.height or .tags["building:levels"]) | {t:.type,id:.id,lat:(.center.lat),lon:(.center.lon),b:(.tags.building//.tags["building:part"]),part:.tags["building:part"],h:.tags.height,lv:.tags["building:levels"],name:.tags.name}' a.json | sort -t: -k1 | head -60
