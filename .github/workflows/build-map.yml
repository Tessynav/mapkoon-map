# Builds the MapKoon 3D map from open data and publishes it on GitHub Pages.
# Runs by hand (Actions > Build map > Run workflow) and once a month, after Overture's monthly release.
name: Build map

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Area to build (montreal or test)'
        default: 'montreal'
  schedule:
    - cron: '23 7 25 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-map
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
      boroughs: ${{ steps.p.outputs.boroughs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: builder/requirements.txt }
      - run: pip install -r builder/requirements.txt
      - id: p
        run: |
          python builder/plan.py "${{ github.event.inputs.region || 'montreal' }}" plan >> "$GITHUB_OUTPUT"
          B=$(python -c "import json;print(','.join(map(str,json.load(open('plan/plan.json'))['bbox'])))")
          python builder/overture.py index "$B" plan/idx.json
      - name: Lane counts and widths from OpenStreetMap
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          B=$(python -c "import json;b=json.load(open('plan/plan.json'))['bbox'];print('%f,%f,%f,%f'%(b[0]-0.01,b[1]-0.01,b[2]+0.01,b[3]+0.01))")
          python builder/osm.py "$B" plan/osm_ways.json
      - name: Real road widths from the City of Montréal (the "city" branch, made by Get city roads)
        continue-on-error: true
        run: |
          git fetch --depth 1 origin city && git worktree add city-data FETCH_HEAD
          python builder/city.py prep city-data plan/city.json.gz
      - uses: actions/upload-artifact@v4
        with: { name: plan, path: plan/, retention-days: 2 }

  heights:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        borough: ${{ fromJSON(needs.plan.outputs.boroughs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: builder/requirements.txt }
      - run: pip install -r builder/requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: plan, path: plan }
      - run: python builder/heights.py "${{ matrix.borough }}" plan/plan.json plan/idx.json "h/heights_${{ matrix.borough }}.json"
      - uses: actions/upload-artifact@v4
        with: { name: 'heights-${{ matrix.borough }}', path: h/, retention-days: 2 }

  chunk:
    needs: [plan, heights]
    # a missing height file only means default heights there; the map is still built
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: builder/requirements.txt }
      - run: pip install -r builder/requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: plan, path: plan }
      - uses: actions/download-artifact@v4
        with: { pattern: 'heights-*', path: h, merge-multiple: true }
      - name: Build tiles
        run: |
          read T B < <(python -c "import json;c=[c for c in json.load(open('plan/plan.json'))['chunks'] if c['id']=='${{ matrix.chunk }}'][0];print(c['tiles'],c['bbox'])")
          python builder/overture.py read plan/idx.json "$B" data
          cp plan/osm_ways.json data/
          cp plan/city.json.gz data/ 2>/dev/null || echo 'no city widths file: estimated widths'
          python builder/build.py data out --tiles="$T" --heights h
      - uses: actions/upload-artifact@v4
        with: { name: 'tiles-${{ matrix.chunk }}', path: out/, retention-days: 2 }

  publish:
    needs: chunk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { name: plan, path: plan }
      - uses: actions/download-artifact@v4
        with: { pattern: 'tiles-*', path: site, merge-multiple: true }
      - run: |
          python builder/merge.py site plan/plan.json plan/idx.json
          rm -rf site/parts site/checks
          cp site-files/* site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
