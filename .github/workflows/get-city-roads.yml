# Downloads the Ville de Montréal road outlines (curb to curb, intersections, sidewalks, islands; CC BY 4.0)
# and keeps a zipped copy on the "city" branch, so the map builder (and Claude, for testing) can read them.
# Actions > Get city roads > Run workflow. Takes a few minutes. Builds nothing, changes nothing in the live map.
name: Get city roads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download from donnees.montreal.ca (or its copy on donneesquebec.ca)
        run: |
          set -u
          mkdir -p city
          UA="Mozilla/5.0 (X11; Linux x86_64) MapKoon-builder"
          ok=0
          for ds in voirie-chaussee-intersection voirie-trottoir-ilot; do
            got=0
            for site in "https://donnees.montreal.ca" "https://www.donneesquebec.ca/recherche"; do
              for id in "$ds" "vmtl-$ds"; do
                [ $got = 1 ] && break
                code=$(curl -sL -A "$UA" -o meta.json -w '%{http_code}' "$site/api/3/action/package_show?id=$id")
                echo "$site $id -> HTTP $code"
                [ "$code" = 200 ] || continue
                jq -r '.result.resources[] | select((.format|ascii_downcase)=="geojson" or (.url|test("geojson";"i"))) | .url' meta.json > urls.txt || continue
                cat urls.txt; [ -s urls.txt ] || continue
                while read -r u; do
                  n=$(basename "${u%%\?*}")
                  c2=$(curl -sL -A "$UA" -o "city/$n" -w '%{http_code}' "$u"); echo "  $n -> HTTP $c2"
                  if [ "$c2" = 200 ] && [ -s "city/$n" ]; then gzip -9 -f "city/$n"; ls -la "city/$n.gz"; got=1; else rm -f "city/$n"; fi
                done < urls.txt
              done
            done
            [ $got = 1 ] && ok=$((ok+1)) || echo "COULD NOT GET $ds"
          done
          echo "datasets downloaded: $ok of 2"
          [ $ok -ge 1 ] || exit 1
          echo "Contient des données de la Ville de Montréal, licence CC BY 4.0 (https://donnees.montreal.ca)." > city/CREDIT.txt
          date -u +%Y-%m-%dT%H:%MZ > city/DATE.txt
      - name: Keep them on the city branch
        run: |
          set -e
          cd city
          git init -q -b city
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "City of Montréal road outlines $(cat DATE.txt)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" city
